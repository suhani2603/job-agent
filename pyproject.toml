[project]
name = "jobagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Suhani Chadha", email = "suhanichadha017@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
jobagent = "jobagent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
